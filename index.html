<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notfallmedizinprüfung 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.55;background:#f5f5f3;color:#1a1a18;min-height:100vh}
a{color:inherit;text-decoration:none}

/* Header */
header{background:#fff;border-bottom:1px solid #e0dfd8;padding:1.25rem 1.5rem 1rem;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
h1{font-size:1.25rem;font-weight:600;letter-spacing:-0.01em}
.hdr-sub{font-size:0.8rem;color:#888;margin-top:2px}
.filters{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.75rem}
.filter-btn{padding:0.3rem 0.75rem;border:1px solid #d4d4cc;border-radius:20px;background:#fff;font-size:0.8rem;cursor:pointer;transition:all .15s;color:#555}
.filter-btn:hover{border-color:#888;color:#111}
.filter-btn.active{background:#1a1a18;color:#fff;border-color:#1a1a18}
.filter-btn.cat-btn[data-cat="kardiologie"].active{background:#dc2626;border-color:#dc2626}
.filter-btn.cat-btn[data-cat="pulmonal"].active{background:#1d4ed8;border-color:#1d4ed8}
.filter-btn.cat-btn[data-cat="neurologie"].active{background:#6d28d9;border-color:#6d28d9}
.filter-btn.cat-btn[data-cat="intern"].active{background:#047857;border-color:#047857}
.filter-btn.cat-btn[data-cat="trauma"].active{background:#b45309;border-color:#b45309}
.filter-btn.cat-btn[data-cat="paediatrie"].active{background:#15803d;border-color:#15803d}
.filter-btn.cat-btn[data-cat="organisation"].active{background:#374151;border-color:#374151}

/* Grid */
#grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:1.25rem 1.5rem;max-width:1400px}
.card{background:#fff;border:1px solid #e0dfd8;border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .1s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
.card-stripe{height:4px;width:100%}
.card-body{padding:1rem 1.1rem 0.9rem;flex:1;display:flex;flex-direction:column;gap:0.5rem}
.card-meta{display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap}
.card-num{font-size:0.75rem;color:#aaa;font-weight:500}
.badge{font-size:0.7rem;padding:0.2rem 0.55rem;border-radius:12px;font-weight:500;letter-spacing:0.01em}
.card-title{font-size:0.97rem;font-weight:600;line-height:1.35}
.card-alarm{font-size:0.82rem;color:#555;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{padding:0.6rem 1.1rem;border-top:1px solid #f0efea;font-size:0.8rem;color:#888;display:flex;align-items:center;justify-content:space-between}
.card-footer span{display:flex;align-items:center;gap:0.3rem}

/* Category colors */
.stripe-kardiologie,.badge-kardiologie{background:#ef4444}
.badge-kardiologie{color:#7f1d1d}
.bg-kardiologie{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.stripe-pulmonal,.badge-pulmonal{background:#3b82f6}
.badge-pulmonal{color:#1e3a8a}
.bg-pulmonal{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.stripe-neurologie,.badge-neurologie{background:#8b5cf6}
.badge-neurologie{color:#3b0764}
.bg-neurologie{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.stripe-intern,.badge-intern{background:#10b981}
.badge-intern{color:#064e3b}
.bg-intern{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.stripe-trauma,.badge-trauma{background:#f59e0b}
.badge-trauma{color:#78350f}
.bg-trauma{background:#fffbeb;color:#b45309;border-color:#fde68a}
.stripe-paediatrie,.badge-paediatrie{background:#22c55e}
.badge-paediatrie{color:#14532d}
.bg-paediatrie{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.stripe-organisation,.badge-organisation{background:#6b7280}
.badge-organisation{color:#111827}
.bg-organisation{background:#f9fafb;color:#374151;border-color:#d1d5db}

.diff-basis{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.diff-fortgeschritten{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}

/* Detail view */
#detail-view{display:none;padding:1.25rem 1.5rem;max-width:900px}
.detail-back{display:inline-flex;align-items:center;gap:0.5rem;color:#555;font-size:0.88rem;cursor:pointer;margin-bottom:1rem;padding:0.4rem 0;border:none;background:none}
.detail-back:hover{color:#111}
.detail-header{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.detail-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:0.75rem}
.detail-title{font-size:1.3rem;font-weight:700;line-height:1.3}
.detail-badges{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.4rem}
.detail-alarm{font-size:0.9rem;color:#444;line-height:1.6;background:#fafaf8;border:1px solid #e8e8e0;border-radius:6px;padding:0.75rem 1rem;margin-top:0.75rem}
.detail-alarm strong{color:#111;display:block;margin-bottom:0.3rem;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.04em}

.vitals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:0.5rem;margin-top:0.75rem}
.vital-box{background:#f9f9f7;border:1px solid #e5e5dc;border-radius:6px;padding:0.45rem 0.6rem;text-align:center}
.vital-label{font-size:0.68rem;color:#888;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px}
.vital-value{font-size:1rem;font-weight:600;line-height:1.2}
.vital-value.abnormal{color:#dc2626}
.vital-value.warning{color:#d97706}

.detail-section{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1.1rem 1.4rem;margin-bottom:0.75rem}
.section-title{font-size:0.78rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#888;margin-bottom:0.85rem;display:flex;align-items:center;gap:0.4rem}
.section-title::before{content:'';display:inline-block;width:3px;height:14px;border-radius:2px;background:currentColor}

.eh-list{display:flex;flex-direction:column;gap:0.4rem}
.eh-item{display:flex;gap:0.6rem;align-items:flex-start;font-size:0.88rem;line-height:1.5;padding:0.45rem 0.6rem;background:#f9faf8;border-radius:5px}
.eh-check{width:18px;height:18px;min-width:18px;border:1.5px solid #d1d5db;border-radius:4px;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;background:#fff}
.eh-check.checked{background:#16a34a;border-color:#16a34a;color:#fff}
.eh-check.checked::after{content:'✓';font-size:11px;font-weight:700}

.fragen-list{display:flex;flex-direction:column;gap:0.5rem;counter-reset:fragen}
.frage-item{counter-increment:fragen;display:flex;gap:0.7rem;font-size:0.88rem;line-height:1.5;padding:0.5rem 0.7rem;border-left:3px solid #e5e7eb;border-radius:0 5px 5px 0}
.frage-item::before{content:counter(fragen);font-size:0.75rem;font-weight:700;color:#9ca3af;min-width:16px;margin-top:1px}

.meds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.5rem}
.med-card{background:#fafaf8;border:1px solid #e5e5dc;border-radius:6px;padding:0.6rem 0.8rem}
.med-name{font-weight:600;font-size:0.88rem;margin-bottom:2px}
.med-dosis{font-family:'Courier New',Courier,monospace;font-size:0.83rem;color:#1d4ed8;margin-bottom:3px}
.med-hinweis{font-size:0.78rem;color:#666;line-height:1.4}

.fallstricke-list{display:flex;flex-direction:column;gap:0.4rem}
.fallstrick-item{display:flex;gap:0.5rem;font-size:0.86rem;line-height:1.45;padding:0.4rem 0.6rem;background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;color:#7c2d12}
.fallstrick-item::before{content:'⚠';font-size:0.9rem}

.befund-box{font-size:0.87rem;color:#333;line-height:1.6;padding:0.6rem 0.8rem;background:#f9f9f7;border:1px solid #e5e5dc;border-radius:6px}
.notruf-box{font-size:.85rem;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:.65rem 1rem;margin-top:.5rem;line-height:1.55}
.notruf-box b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#b45309;margin-bottom:.2rem}
.card-stw{font-size:.72rem;color:#777;font-style:italic;margin-top:.1rem}

.detail-print-btn{margin-top:0.5rem;padding:0.5rem 1rem;background:#fff;border:1px solid #d4d4cc;border-radius:6px;font-size:0.83rem;cursor:pointer;color:#555}
.detail-print-btn:hover{border-color:#888;color:#111}

/* Print */
@media print{
  header,#grid-view,.detail-back,.detail-print-btn{display:none!important}
  #detail-view{display:block!important;padding:0}
  .card,.detail-section,.detail-header{page-break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .eh-check{display:none}
  body{background:#fff;font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="hdr-top">
    <h1>Notfallmedizinprüfung 2026</h1>
    <span class="hdr-sub">AGNN-Therapieempfehlungen 2026 · Zusatzweiterbildung Notfallmedizin · Muster-WBO BÄK</span>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Alle (37)</button>
    <button class="filter-btn cat-btn" data-cat="kardiologie">Kardiologie</button>
    <button class="filter-btn cat-btn" data-cat="pulmonal">Pulmonal · Allergie</button>
    <button class="filter-btn cat-btn" data-cat="neurologie">Neurologie</button>
    <button class="filter-btn cat-btn" data-cat="intern">Internistisch</button>
    <button class="filter-btn cat-btn" data-cat="trauma">Traumatologie</button>
    <button class="filter-btn cat-btn" data-cat="paediatrie">Pädiatrie</button>
    <button class="filter-btn cat-btn" data-cat="organisation">Organisation · Recht</button>
  </div>
</header>

<div id="grid-view"></div>
<div id="detail-view"></div>

<script>

  organisation:'Organisation · Recht'

const cases = [
// ── KARDIOLOGIE ────────────────────────────────────────────
{
  id:1, cat:'kardiologie', diff:'fortgeschritten',

  fragen:[

    'Bei welchen Zeichen ist sofortige Kardioversion indiziert?',

    'Verhindert Lyse: ACS-Mimikry → Lyse bei Dissektion = fatal (Perikardtamponade, unkontrollierte Blutung)'
  ],
  fragen:[
    'Wie unterscheiden Sie klinisch eine Aortendissektion von einem STEMI?',

    {n:'Esmolol',d:'0,5 mg/kg Bolus i.v., dann 0,05–0,3 mg/kg/min',h:'Kurzwirksamer Beta-Blocker – gut steuerbar'},

    {n:'Fentanyl',d:'0,05–0,1 mg titriert i.v.',h:'Analgesie senkt Katecholaminausschüttung und Wandscherspannung'}
  ],
  fallstricke:[
    'Lyse bei ACS-Mimikry der Dissektion → perikardiale/mediastinale Blutung, Tod!',
    'Nitrat als Monotherapie → Reflex-Tachykardie → erhöhte Wandscherspannung → Progression',

];

// ── Rendering ─────────────────────────────────────────────

let currentFilter = 'all';
let checkState = {}; // {caseId: [bool]}

function getCatLabel(cat){ return CATS[cat] || cat; }

function renderBadge(cls, text){
  return `<span class="badge ${cls}">${text}</span>`;
}

function renderStripe(cat){ return `<div class="card-stripe stripe-${cat}"></div>`; }

function renderGrid(filter){
  const filtered = filter === 'all' ? cases : cases.filter(c => c.cat === filter);
  const grid = document.getElementById('grid-view');
  grid.innerHTML = filtered.map(c => `
    <div class="card" onclick="openCase(${c.id})">
      ${renderStripe(c.cat)}
      <div class="card-body">
        <div class="card-meta">
          <span class="card-num">Fall ${c.id}</span>
          ${renderBadge('badge bg-'+c.cat, getCatLabel(c.cat))}
          ${renderBadge('diff-'+c.diff, c.diff==='basis'?'Basis':'Fortgeschritten')}
        </div>
        <div class="card-title">${c.title}</div>
        ${c.stichwort ? `<div class="card-stw">📟 ${c.stichwort}</div>` : ''}
        <div class="card-alarm">${c.alarm}</div>
      </div>
      <div class="card-footer">
        <span style="font-size:.75rem;color:#aaa">AGNN: ${c.agnn}</span>
        <span>→</span>
      </div>
    </div>
  `).join('');
}

function openCase(id){
  const c = cases.find(x => x.id === id);
  if(!c) return;
  if(!checkState[id]) checkState[id] = c.eh.map(()=>false);

  const vt = c.vitals;
  function isAbnormal(key, val){
    if(!val || val === 'n.m.' || val === 'n.e.' || val === '–') return '';
    const n = parseFloat(val);
    if(isNaN(n)) return '';
    if(key==='HF' && (n>100||n<50)) return 'abnormal';
    if(key==='SpO2' && n<94) return 'abnormal';
    if(key==='AF' && (n>20||n<10)) return 'warning';
    if(key==='GCS' && n<15) return n<=8?'abnormal':'warning';
    if(key==='BZ'){
      const mg = val.includes('mmol') ? n*18 : n;
      if(mg<60||mg>180) return 'warning';
    }
    return '';
  }

  const vitalKeys = [
    {k:'RR',l:'RR (mmHg)'},
    {k:'HF',l:'HF (/min)'},
    {k:'SpO2',l:'SpO₂'},
    {k:'AF',l:'AF (/min)'},
    {k:'GCS',l:'GCS'},
    {k:'BZ',l:'BZ'},
    {k:'Temp',l:'Temp'},
  ];

  const vitalsHtml = vitalKeys.filter(vk => vt[vk.k]).map(vk => {
    const cls = isAbnormal(vk.k, vt[vk.k]);
    return `<div class="vital-box">
      <div class="vital-label">${vk.l}</div>
      <div class="vital-value ${cls}">${vt[vk.k]}</div>
    </div>`;
  }).join('');

  const ehHtml = c.eh.map((e,i) => {
    const checked = checkState[id][i];
    return `<div class="eh-item">
      <div class="eh-check ${checked?'checked':''}" onclick="toggleEH(${c.id},${i});event.stopPropagation()"></div>
      <span>${e}</span>
    </div>`;
  }).join('');

  const fragenHtml = c.fragen.map(f => `<div class="frage-item">${f}</div>`).join('');

  const medsHtml = c.meds.length ? `<div class="meds-grid">${c.meds.map(m=>`
    <div class="med-card">
      <div class="med-name">${m.n}</div>
      <div class="med-dosis">${m.d}</div>
      ${m.h ? `<div class="med-hinweis">${m.h}</div>` : ''}
    </div>`).join('')}</div>` : '<em style="color:#aaa;font-size:.85rem">Keine spezifischen Medikamente</em>';

  const fallstrickeHtml = c.fallstricke.length ? `<div class="fallstricke-list">${c.fallstricke.map(f=>`<div class="fallstrick-item">${f}</div>`).join('')}</div>` : '';

  document.getElementById('detail-view').innerHTML = `
    <button class="detail-back" onclick="closeCase()">← Zurück zur Übersicht</button>
    <div class="detail-header">
      <div class="detail-header-top">
        <div>
          <div style="font-size:.75rem;color:#aaa;font-weight:500;margin-bottom:.25rem">Fall ${c.id} · AGNN: ${c.agnn}</div>
          <div class="detail-title">${c.title}</div>
          <div class="detail-badges">
            ${renderBadge('badge bg-'+c.cat, getCatLabel(c.cat))}
            ${renderBadge('diff-'+c.diff, c.diff==='basis'?'Basis':'Fortgeschritten')}
          </div>
        </div>
        <button class="detail-print-btn" onclick="window.print()">Drucken</button>
      </div>
      <div class="detail-alarm">
        <strong>Alarmierung / Fallvorstellung</strong>
        ${c.alarm}
      </div>
      ${c.notruf ? `<div class="notruf-box"><b>Notruf-Meldung (was die Leitstelle meldet)</b>${c.notruf}</div>` : ''}
      <div class="vitals-grid">${vitalsHtml}</div>
      ${c.befund ? `<div class="befund-box" style="margin-top:.75rem"><strong style="font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:#888;display:block;margin-bottom:.3rem">Befund</strong>${c.befund}</div>` : ''}
    </div>

    <div class="detail-section">
      <div class="section-title" style="color:#047857">Erwartungshorizont (Muster-WBO Notfallmedizin)</div>
      <div class="eh-list" id="eh-list-${c.id}">${ehHtml}</div>
      <div style="margin-top:.6rem;font-size:.75rem;color:#aaa">Häkchen = Kandidat hat diesen Punkt korrekt benannt</div>
    </div>

    <div class="detail-section">
      <div class="section-title" style="color:#1d4ed8">Prüferfragen</div>
      <div class="fragen-list">${fragenHtml}</div>
    </div>

    <div class="detail-section">
      <div class="section-title" style="color:#b45309">AGNN-Medikamente & Dosierungen (2026)</div>
      ${medsHtml}
    </div>

    ${fallstrickeHtml ? `<div class="detail-section">
      <div class="section-title" style="color:#dc2626">Typische Fehler / Fallstricke</div>
      ${fallstrickeHtml}
    </div>` : ''}
  `;

  document.getElementById('grid-view').style.display = 'none';
  const dv = document.getElementById('detail-view');
  dv.style.display = 'block';
  dv.scrollIntoView({behavior:'smooth',block:'start'});
  window.scrollTo(0,0);
}

function closeCase(){
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('grid-view').style.display = 'grid';
}

function toggleEH(caseId, idx){
  if(!checkState[caseId]) return;
  checkState[caseId][idx] = !checkState[caseId][idx];
  const list = document.getElementById('eh-list-'+caseId);
  if(list){
    const items = list.querySelectorAll('.eh-check');
    if(items[idx]){
      items[idx].classList.toggle('checked', checkState[caseId][idx]);
    }
  }
}

// Filter buttons
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat || 'all';
  currentFilter = cat;
  renderGrid(currentFilter);
});

renderGrid('all');
</script>
</body>
</html>
