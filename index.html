<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notfallmedizinprüfung 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.55;background:#f5f5f3;color:#1a1a18;min-height:100vh}
a{color:inherit;text-decoration:none}

/* Header */
header{position:relative;background:#fff;border-bottom:1px solid #e0dfd8;padding:1.25rem 1.5rem 1rem;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
h1{font-size:1.25rem;font-weight:600;letter-spacing:-0.01em}
.hdr-sub{font-size:0.8rem;color:#888;margin-top:2px}
.filters{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.75rem}
.filter-btn{padding:0.3rem 0.75rem;border:1px solid #d4d4cc;border-radius:20px;background:#fff;font-size:0.8rem;cursor:pointer;transition:all .15s;color:#555}
.filter-btn:hover{border-color:#888;color:#111}
.filter-btn.active{background:#1a1a18;color:#fff;border-color:#1a1a18}
.filter-btn.cat-btn[data-cat="kardiologie"].active{background:#dc2626;border-color:#dc2626}
.filter-btn.cat-btn[data-cat="pulmonal"].active{background:#1d4ed8;border-color:#1d4ed8}
.filter-btn.cat-btn[data-cat="neurologie"].active{background:#6d28d9;border-color:#6d28d9}
.filter-btn.cat-btn[data-cat="intern"].active{background:#047857;border-color:#047857}
.filter-btn.cat-btn[data-cat="trauma"].active{background:#b45309;border-color:#b45309}
.filter-btn.cat-btn[data-cat="paediatrie"].active{background:#15803d;border-color:#15803d}
.filter-btn.cat-btn[data-cat="organisation"].active{background:#374151;border-color:#374151}

/* Grid */
#grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:1.25rem 1.5rem;max-width:1400px}
.card{background:#fff;border:1px solid #e0dfd8;border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .1s;display:flex;flex-direction:column}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px)}
.card-stripe{height:4px;width:100%}
.card-body{padding:1rem 1.1rem 0.9rem;flex:1;display:flex;flex-direction:column;gap:0.5rem}
.card-meta{display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap}
.card-num{font-size:0.75rem;color:#aaa;font-weight:500}
.badge{font-size:0.7rem;padding:0.2rem 0.55rem;border-radius:12px;font-weight:500;letter-spacing:0.01em}
.card-title{font-size:0.97rem;font-weight:600;line-height:1.35}
.card-alarm{font-size:0.82rem;color:#555;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{padding:0.6rem 1.1rem;border-top:1px solid #f0efea;font-size:0.8rem;color:#888;display:flex;align-items:center;justify-content:space-between}
.card-footer span{display:flex;align-items:center;gap:0.3rem}

/* Category colors */
.stripe-kardiologie,.badge-kardiologie{background:#ef4444}
.badge-kardiologie{color:#7f1d1d}
.bg-kardiologie{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.stripe-pulmonal,.badge-pulmonal{background:#3b82f6}
.badge-pulmonal{color:#1e3a8a}
.bg-pulmonal{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.stripe-neurologie,.badge-neurologie{background:#8b5cf6}
.badge-neurologie{color:#3b0764}
.bg-neurologie{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.stripe-intern,.badge-intern{background:#10b981}
.badge-intern{color:#064e3b}
.bg-intern{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.stripe-trauma,.badge-trauma{background:#f59e0b}
.badge-trauma{color:#78350f}
.bg-trauma{background:#fffbeb;color:#b45309;border-color:#fde68a}
.stripe-paediatrie,.badge-paediatrie{background:#22c55e}
.badge-paediatrie{color:#14532d}
.bg-paediatrie{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.stripe-organisation,.badge-organisation{background:#6b7280}
.badge-organisation{color:#111827}
.bg-organisation{background:#f9fafb;color:#374151;border-color:#d1d5db}

.diff-basis{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.diff-fortgeschritten{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}

/* Detail view */
#detail-view{display:none;padding:1.25rem 1.5rem;max-width:900px}
.detail-back{display:inline-flex;align-items:center;gap:0.5rem;color:#555;font-size:0.88rem;cursor:pointer;margin-bottom:1rem;padding:0.4rem 0;border:none;background:none}
.detail-back:hover{color:#111}
.detail-header{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.detail-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:0.75rem}
.detail-title{font-size:1.3rem;font-weight:700;line-height:1.3}
.detail-badges{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.4rem}
.detail-alarm{font-size:0.9rem;color:#444;line-height:1.6;background:#fafaf8;border:1px solid #e8e8e0;border-radius:6px;padding:0.75rem 1rem;margin-top:0.75rem}
.detail-alarm strong{color:#111;display:block;margin-bottom:0.3rem;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.04em}

.vitals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:0.5rem;margin-top:0.75rem}
.vital-box{background:#f9f9f7;border:1px solid #e5e5dc;border-radius:6px;padding:0.45rem 0.6rem;text-align:center}
.vital-label{font-size:0.68rem;color:#888;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px}
.vital-value{font-size:1rem;font-weight:600;line-height:1.2}
.vital-value.abnormal{color:#dc2626}
.vital-value.warning{color:#d97706}

.detail-section{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1.1rem 1.4rem;margin-bottom:0.75rem}
.section-title{font-size:0.78rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#888;margin-bottom:0.85rem;display:flex;align-items:center;gap:0.4rem}
.section-title::before{content:'';display:inline-block;width:3px;height:14px;border-radius:2px;background:currentColor}

.eh-list{display:flex;flex-direction:column;gap:0.4rem}
.eh-item{display:flex;gap:0.6rem;align-items:flex-start;font-size:0.88rem;line-height:1.5;padding:0.45rem 0.6rem;background:#f9faf8;border-radius:5px}
.eh-check{width:18px;height:18px;min-width:18px;border:1.5px solid #d1d5db;border-radius:4px;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;background:#fff}
.eh-check.checked{background:#16a34a;border-color:#16a34a;color:#fff}
.eh-check.checked::after{content:'✓';font-size:11px;font-weight:700}
.eh-nf{font-size:.76rem;color:#6b7280;font-style:italic;margin-top:.25rem;padding-left:.4rem;border-left:2px solid #d1d5db;line-height:1.45;position:relative;cursor:help}
.eh-nf[data-answer]:hover::after{content:attr(data-answer);position:absolute;left:0;top:calc(100% + 4px);background:#1f2937;color:#f9fafb;padding:.65rem .95rem;border-radius:7px;font-size:.79rem;font-style:normal;line-height:1.55;min-width:260px;max-width:500px;white-space:normal;z-index:500;box-shadow:0 4px 18px rgba(0,0,0,.32);pointer-events:none}

.fragen-list{display:flex;flex-direction:column;gap:0.5rem;counter-reset:fragen}
.frage-item{counter-increment:fragen;display:flex;gap:0.7rem;font-size:0.88rem;line-height:1.5;padding:0.5rem 0.7rem;border-left:3px solid #e5e7eb;border-radius:0 5px 5px 0}
.frage-item::before{content:counter(fragen);font-size:0.75rem;font-weight:700;color:#9ca3af;min-width:16px;margin-top:1px}

.meds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.5rem}
.med-card{background:#fafaf8;border:1px solid #e5e5dc;border-radius:6px;padding:0.6rem 0.8rem}
.med-name{font-weight:600;font-size:0.88rem;margin-bottom:2px}
.med-dosis{font-family:'Courier New',Courier,monospace;font-size:0.83rem;color:#1d4ed8;margin-bottom:3px}
.med-hinweis{font-size:0.78rem;color:#666;line-height:1.4}

.fallstricke-list{display:flex;flex-direction:column;gap:0.4rem}
.fallstrick-item{display:flex;gap:0.5rem;font-size:0.86rem;line-height:1.45;padding:0.4rem 0.6rem;background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;color:#7c2d12}
.fallstrick-item::before{content:'⚠';font-size:0.9rem}

.befund-box{font-size:0.87rem;color:#333;line-height:1.6;padding:0.6rem 0.8rem;background:#f9f9f7;border:1px solid #e5e5dc;border-radius:6px}
.dispatch-chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0 .4rem}
.dispatch-chip{font-size:.8rem;font-weight:600;padding:.28rem .85rem;border-radius:20px;letter-spacing:.01em}
.dispatch-chip.korrekt{background:#f0fdf4;color:#15803d;border:1px solid #86efac}
.dispatch-chip.irre{background:#fff7ed;color:#c2410c;border:1px solid #fdba74}
.card-stw{font-size:.72rem;color:#777;font-style:italic;margin-top:.1rem}

.detail-print-btn{margin-top:0.5rem;padding:0.5rem 1rem;background:#fff;border:1px solid #d4d4cc;border-radius:6px;font-size:0.83rem;cursor:pointer;color:#555}
.detail-print-btn:hover{border-color:#888;color:#111}

/* Prüfungsplanung */
.pruefling-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;align-items:center}
.pruefling-label{font-size:.78rem;color:#888;font-weight:500;white-space:nowrap;margin-right:.2rem}
.pl-btn{padding:.3rem .8rem;border:1px solid #d4d4cc;border-radius:20px;background:#fff;font-size:.8rem;cursor:pointer;color:#555;transition:all .15s;white-space:nowrap}
.pl-btn:hover{border-color:#888;color:#111}
.pl-btn.active{background:#1a1a18;color:#fff;border-color:#1a1a18}
.pl-assign-btn{background:#f0fdf4;border-color:#86efac;color:#15803d}
.pl-assign-btn.active{background:#15803d;border-color:#15803d;color:#fff}
.card{position:relative}
.card-assign-toggle{position:absolute;top:.5rem;right:.5rem;z-index:10;width:22px;height:22px;border-radius:50%;border:1.5px solid #d1d5db;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;line-height:1;transition:all .15s;user-select:none}
.card-assign-toggle.assigned{background:#16a34a;border-color:#16a34a;color:#fff}
.card-assign-toggle.unassigned{color:#9ca3af}
.card-assign-toggle:hover{transform:scale(1.15)}
.grid-assign-mode{outline:2px dashed #86efac;outline-offset:6px;border-radius:12px}

/* Print */
@media print{
  header,#grid-view,.detail-back,.detail-print-btn{display:none!important}
  #detail-view{display:block!important;padding:0}
  .card,.detail-section,.detail-header{page-break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .eh-check{display:none}
  body{background:#fff;font-size:12px}
}

.wbo-btn{position:absolute;top:1rem;right:1.2rem;background:#334;color:#a0b4d4;border:1px solid #4a6080;padding:4px 10px;border-radius:5px;font-size:0.78rem;cursor:pointer;text-decoration:none;white-space:nowrap;z-index:10}
.wbo-btn:hover{background:#3d4f6a;color:#cde}
.wbo-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9000;align-items:center;justify-content:center}
.wbo-modal-overlay.open{display:flex}
.wbo-modal{background:#1a1d27;border:1px solid #334;border-radius:10px;width:min(860px,96vw);height:min(90vh,1000px);display:flex;flex-direction:column;overflow:hidden}
.wbo-modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;border-bottom:1px solid #334;flex-shrink:0}
.wbo-modal-hdr h3{margin:0;font-size:0.95rem;color:#cde}
.wbo-modal-close{background:none;border:none;color:#888;font-size:1.3rem;cursor:pointer;padding:2px 6px;border-radius:4px}
.wbo-modal-close:hover{background:#333;color:#cde}
.wbo-modal iframe{flex:1;border:none;background:#fff}

</style>
</head>
<body>
<header>
  <div class="hdr-top" style="position:relative">
  <a class="wbo-btn" href="#" onclick="document.getElementById('wbo-modal').classList.add('open');return false">WBO Notfallmedizin</a>
    <h1>Notfallmedizinprüfung 2026</h1>
    <span class="hdr-sub">AGNN-Therapieempfehlungen 2026 · Zusatzweiterbildung Notfallmedizin · Muster-WBO BÄK</span>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Alle (48)</button>
    <button class="filter-btn cat-btn" data-cat="kardiologie">Kardiologie</button>
    <button class="filter-btn cat-btn" data-cat="pulmonal">Pulmonal · Allergie</button>
    <button class="filter-btn cat-btn" data-cat="neurologie">Neurologie</button>
    <button class="filter-btn cat-btn" data-cat="intern">Internistisch</button>
    <button class="filter-btn cat-btn" data-cat="trauma">Traumatologie</button>
    <button class="filter-btn cat-btn" data-cat="paediatrie">Pädiatrie</button>
    <button class="filter-btn cat-btn" data-cat="organisation">Organisation · Recht</button>
  </div>
  <div class="pruefling-row" id="pruefling-row">
    <span class="pruefling-label">Prüfling:</span>
    <button class="pl-btn active" data-pl="0" onclick="selectPruefling(0)">Alle</button>
    <button class="pl-btn" data-pl="1" onclick="selectPruefling(1)">Biehler</button>
    <button class="pl-btn" data-pl="2" onclick="selectPruefling(2)">Dreyer</button>
    <button class="pl-btn" data-pl="3" onclick="selectPruefling(3)">Dupont</button>
    <button class="pl-btn" data-pl="4" onclick="selectPruefling(4)">Lempferdt</button>
    <button class="pl-btn pl-assign-btn" id="pl-assign-btn" onclick="toggleAssignMode()" style="display:none" title="Fälle zuordnen / entfernen">Zuordnung bearbeiten</button>
  </div>
</header>

<div id="grid-view"></div>
<div id="detail-view"></div>

<script>
const CATS = {
  kardiologie:'Kardiologie',
  pulmonal:'Pulmonal · Allergie',
  neurologie:'Neurologie',
  intern:'Internistisch',
  trauma:'Traumatologie',
  paediatrie:'Pädiatrie',
  organisation:'Organisation · Recht'
};

const cases = [
// ── KARDIOLOGIE ────────────────────────────────────────────
{
  id:1, cat:'kardiologie', diff:'fortgeschritten',
  title:'STEMI mit kardiogenem Schock',
  agnn:'Akutes Koronarsyndrom (ACS), Schock',
  stichwort:'M 72 · Bauchschmerzen, Schwindel, blass',
  notruf:{korrekt:'M 72 · STEMI / kard. Schock', irre:'M 72 · Magenschmerzen'},
  alarm:'72-jähriger Mann, Brustschmerz seit 60 min mit Ausstrahlung in den linken Arm, Kaltschweißigkeit, Schwindel. Ehefrau ruft Rettungsdienst.',
  befund:'Patient blass-kaltschweißig, marmorierte Haut, kein Ödeme. Lunge: basale feuchte RG bds. 12-Kanal-EKG: ST-Hebungen in II, III, aVF → V. a. Hinterwandinfarkt. CAVE: V3R/V4R zeigen ST-Hebungen → Rechtsherzinfarkt!',
  vitals:{RR:'85/55',HF:'118/min',SpO2:'90 %',AF:'24/min',GCS:'14',BZ:'148 mg/dl'},
  eh:[
    'Erkennt STEMI anhand von ST-Hebungen im 12-Kanal-EKG; fordert rechtsseitige Ableitungen (V3R/V4R) bei Hinterwandinfarkt',
    'Kennt absolute Kontraindikation für Nitroglycerin beim Rechtsherzinfarkt (RR-Absturz!)',
    'Trifft korrekte Transportentscheidung: primäre PCI (door-to-balloon < 90 min) → Herzkatheterzentrum',
    'Kennt hämodynamische Strategie: vorsichtige Volumen-Gabe beim Rechtsherzinfarkt, Vasopressoren (Noradrenalin) bei persistierendem Schock',
    'Nennt korrekte Pharmakotherapie: ASS + Heparin + titrierte Analgesie (kein Nitroglycerin)',
    'Erkennt Komplikationen: VF als mögliche Folge → Defibrillation bereithalten',
    'Ordnet ST-Hebungsmuster Infarktarealen zu: II/III/aVF → inferior (RCA); V1–V4 → anterior (LAD); I/aVL/V5–V6 → lateral (LCX); V1–V3 ST-Senkung + R>S → posterior (Zusatz V7–V9); V3R/V4R → Rechtsherzinfarkt',
    'Erkennt Hauptstamm-EKG (LMCA-Verschluss): isolierte ST-Hebung aVR (± V1) + diffuse ST-Senkungen ≥6 Ableitungen (I, II, V4–V6) → höchste Mortalität, kardiogener Schock erwartet',
    'Kennt modifizierte Sgarbossa-Kriterien beim LBBB: (1) konkordante ST-Hebung ≥1 mm; (2) konkordante ST-Senkung V1–V3 ≥1 mm; (3) Smith-Modifikation 2012: exzessive diskordante Hebung ST/S-Ratio ≥ –0,25'
  ],
  fragen:[
    'Wie stellen Sie die Diagnose STEMI präklinisch? Welche EKG-Kriterien sind entscheidend?',
    'Warum ist Nitroglycerin beim Rechtsherzinfarkt kontraindiziert?',
    'Lyse oder primäre PCI – wie entscheiden Sie präklinisch?',
    'Wie behandeln Sie die Hypotonie? Wann geben Sie Volumen, wann Katecholamine?',
    'Welche Zielklinik wählen Sie, wenn das nächste KH kein Herzkatheterlabor hat?',
    'Der Patient verliert während des Transports das Bewusstsein und zeigt VF im EKG – Ihr Vorgehen?',
    'Welches Infarktareal und welches Gefäß entspricht ST-Hebungen in II/III/aVF – und welche Zusatzableitungen bei Bradykardie und Hypotonie obligat?',
    'Was bedeutet eine isolierte ST-Hebung in aVR mit diffusen Senkungen in ≥6 Ableitungen – welche Differenzialdiagnose beachten Sie?',
    'Sie sehen nach ROSC einen LBBB. Welche Smith-Sgarbossa-Kriterien sprechen für einen STEMI unter LBBB?'
  ],
  meds:[
    {n:'ASS',d:'150–300 mg p.o. oder i.v.',h:'Sofort – nicht auf EKG-Ergebnis warten'},
    {n:'Heparin',d:'5.000 IE i.v.',h:'Beim STE-ACS am Einsatzort'},
    {n:'Fentanyl',d:'0,05–0,1 mg titriert i.v.',h:'Analgesie – Vorsicht bei Schock'},
    {n:'Noradrenalin',d:'0,1–0,5 µg/kg/min',h:'Vasopressor bei persistierendem Schock'}
  ],
  fallstricke:[
    'Nitrat beim Rechtsherzinfarkt → fataler Blutdruckabfall',
    'V3R/V4R-Ableitungen nicht vergessen bei inferiorem STEMI',
    'Zu aggressive Volumengabe → Verschlechterung der Rechtsherzfunktion'
  ]
},
{
  id:2, cat:'kardiologie', diff:'basis',
  title:'Reanimation bei Kammerflimmern',
  agnn:'Reanimation (Erwachsene)',
  stichwort:'M 65 · Bewusstlosigkeit, Kollaps',
  notruf:{korrekt:'M 65 · Reanimation / VF', irre:'M 65 · Bewusstlos'},
  alarm:'65-jähriger Mann bricht beim Spaziergang zusammen. Passanten beginnen mit Laienreanimation. AED vorhanden aber noch nicht angebracht. Bewusstlosigkeit, keine Atmung.',
  befund:'Pat. bewusstlos, keine Atmung, keine Lebenszeichen. Laienhelfer führen CPR durch. AED signalisiert defibrillierbaren Rhythmus (VF).',
  vitals:{RR:'n.m.',HF:'VF',SpO2:'n.m.',AF:'0/min',GCS:'3',BZ:'n.e.'},
  eh:[
    'Führt strukturierte Reanimation nach aktuellem ERC-Algorithmus: HDM 100–120/min, Tiefe 5–6 cm, 30:2',
    'Minimiert No-Flow-Zeit: Defibrillation mit minimalster CPR-Unterbrechung (Laden während HDM)',
    'Kennt Medikation: Adrenalin 1 mg i.v./i.o. nach 3. Schock, Amiodaron 300 mg nach 3. Schock',
    'Sucht und behandelt reversible Ursachen (4H/HITS): Hypoxie, Hypovolämie, Hypothermie, Hypo-/Hyperkaliämie, Herztamponade, Intoxikation, Thrombose, Spannungspneumothorax',
    'Erkennt ROSC (etCO₂-Anstieg, tastbarer Puls) und leitet Post-Reanimationsmanagement ein',
    'Kennt ECPR-Kriterien und wann Transport unter laufender CPR sinnvoll ist'
  ],
  fragen:[
    'Wie hoch ist die optimale Kompressionsfrequenz und -tiefe? Was sind häufige Fehler?',
    'Wann und wie oft geben Sie Adrenalin? Wann Amiodaron?',
    'Was sind die reversiblen Ursachen eines Kreislaufstillstands? (4H/HITS)',
    'Woran erkennen Sie einen ROSC unter Reanimation?',
    'Was sind Ihre ersten Schritte nach ROSC? Welche Zielwerte streben Sie an?',
    'Wann beenden Sie die Reanimation? Welche Faktoren beeinflussen die Entscheidung?'
  ],
  meds:[
    {n:'Adrenalin',d:'1 mg i.v./i.o. alle 3–5 min',h:'Ab 3. Schock / nach 3 Zyklen bei nicht-defibrillierbarem Rhythmus'},
    {n:'Amiodaron',d:'300 mg i.v./i.o. nach 3. Schock; 150 mg nach 5. Schock',h:'Bei refraktärem VF/pVT'},
    {n:'Natriumbicarbonat',d:'1 mmol/kg i.v.',h:'Nur bei Hyperkaliämie oder Intoxikation mit TCA'}
  ],
  fallstricke:[
    'No-Flow-Zeit > 10 s durch zu lange Rhythmuskontrolle',
    'Beatmung zu schnell/mit zu hohem Druck → Hyperventilation, Thoraxüberblähung',
    'ROSC verpasst → etCO₂-Monitoring obligat!'
  ]
},
{
  id:3, cat:'kardiologie', diff:'fortgeschritten',

// ── Rendering ─────────────────────────────────────────────

let currentFilter = 'all';
let checkState = {}; // {caseId: [bool]}

// ── Prüfungsplanung ───────────────────────────────────────
const DEFAULT_CANDIDATES = [
  {id:1, name:'Biehler',   cases:[21,12,13,32,45]},
  {id:2, name:'Dreyer',    cases:[46,11,27,37]},
  {id:3, name:'Dupont',    cases:[16,34,47,7,9]},
  {id:4, name:'Lempferdt', cases:[22,38,33,20]},
];
let candidates      = [];
let activePruefling = 0;
let assignMode      = false;

function loadCandidates(){
  try{
    const s = localStorage.getItem('nfm_candidates');
    if(s) candidates = JSON.parse(s);
    else  candidates = DEFAULT_CANDIDATES.map(c => ({...c, cases:[...c.cases]}));
  }catch(e){
    candidates = DEFAULT_CANDIDATES.map(c => ({...c, cases:[...c.cases]}));
  }
}
function saveCandidates(){
  try{ localStorage.setItem('nfm_candidates', JSON.stringify(candidates)); }catch(e){}
}
function getCandidate(id){ return candidates.find(c => c.id === id); }

function selectPruefling(id){
  activePruefling = id;
  assignMode = false;
  document.querySelectorAll('.pl-btn[data-pl]').forEach(b =>
    b.classList.toggle('active', parseInt(b.dataset.pl) === id));
  const ab = document.getElementById('pl-assign-btn');
  if(ab){ ab.style.display = id > 0 ? '' : 'none'; ab.classList.remove('active'); }
  renderGrid();
}
function toggleAssignMode(){
  if(!activePruefling) return;
  assignMode = !assignMode;
  const ab = document.getElementById('pl-assign-btn');
  if(ab) ab.classList.toggle('active', assignMode);
  renderGrid();
}
function toggleCaseAssignment(caseId, e){
  e.stopPropagation();
  if(!activePruefling) return;
  const cand = getCandidate(activePruefling);
  if(!cand) return;
  const idx = cand.cases.indexOf(caseId);
  if(idx >= 0) cand.cases.splice(idx, 1);
  else cand.cases.push(caseId);
  saveCandidates();
  renderGrid();
}
// ─────────────────────────────────────────────────────────

function getCatLabel(cat){ return CATS[cat] || cat; }

function renderBadge(cls, text){
  return `<span class="badge ${cls}">${text}</span>`;
}

function renderStripe(cat){ return `<div class="card-stripe stripe-${cat}"></div>`; }

function renderGrid(){
  let filtered;
  if(activePruefling > 0 && !assignMode){
    const cand = getCandidate(activePruefling);
    filtered = cand ? cases.filter(x => cand.cases.includes(x.id)) : [];
  } else {
    filtered = currentFilter === 'all' ? cases : cases.filter(c => c.cat === currentFilter);
  }
  const grid = document.getElementById('grid-view');
  if(assignMode) grid.classList.add('grid-assign-mode');
  else grid.classList.remove('grid-assign-mode');
  grid.innerHTML = filtered.map(c => {
    let assignToggle = '';
    if(assignMode && activePruefling > 0){
      const cand = getCandidate(activePruefling);
      const isAssigned = cand && cand.cases.includes(c.id);
      assignToggle = `<div class="card-assign-toggle ${isAssigned?'assigned':'unassigned'}" onclick="toggleCaseAssignment(${c.id},event)" title="${isAssigned?'Entfernen':'Hinzufügen'}">${isAssigned?'✓':'+'}</div>`;
    }
    return `
    <div class="card" onclick="openCase(${c.id})">
      ${assignToggle}
      ${renderStripe(c.cat)}
      <div class="card-body">
        <div class="card-meta">
          <span class="card-num">Fall ${c.id}</span>
          ${renderBadge('badge bg-'+c.cat, getCatLabel(c.cat))}
          ${renderBadge('diff-'+c.diff, c.diff==='basis'?'Basis':'Fortgeschritten')}
        </div>
        <div class="card-title">${c.title}</div>
        ${c.stichwort ? `<div class="card-stw">📟 ${c.stichwort}</div>` : ''}
        <div class="card-alarm">${c.alarm}</div>
      </div>
      <div class="card-footer">
        <span style="font-size:.75rem;color:#aaa">AGNN: ${c.agnn}</span>
        <span>→</span>
      </div>
    </div>`;
  }).join('');
}

function openCase(id){
  const c = cases.find(x => x.id === id);
  if(!c) return;
  if(!checkState[id]) checkState[id] = c.eh.map(()=>false);

  const vt = c.vitals;
  function isAbnormal(key, val){
    if(!val || val === 'n.m.' || val === 'n.e.' || val === '–') return '';
    const n = parseFloat(val);
    if(isNaN(n)) return '';
    if(key==='HF' && (n>100||n<50)) return 'abnormal';
    if(key==='SpO2' && n<94) return 'abnormal';
    if(key==='AF' && (n>20||n<10)) return 'warning';
    if(key==='GCS' && n<15) return n<=8?'abnormal':'warning';
    if(key==='BZ'){
      const mg = val.includes('mmol') ? n*18 : n;
      if(mg<60||mg>180) return 'warning';
    }
    return '';
  }

  const vitalKeys = [
    {k:'RR',l:'RR (mmHg)'},
    {k:'HF',l:'HF (/min)'},
    {k:'SpO2',l:'SpO₂'},
    {k:'AF',l:'AF (/min)'},
    {k:'GCS',l:'GCS'},
    {k:'BZ',l:'BZ'},
    {k:'Temp',l:'Temp'},
  ];

  const vitalsHtml = vitalKeys.filter(vk => vt[vk.k]).map(vk => {
    const cls = isAbnormal(vk.k, vt[vk.k]);
    return `<div class="vital-box">
      <div class="vital-label">${vk.l}</div>
      <div class="vital-value ${cls}">${vt[vk.k]}</div>
    </div>`;
  }).join('');

  const nfArr = EH_NF[c.id] || [];
  const naArr = EH_NF_A[c.id] || [];
  const ehHtml = c.eh.map((e,i) => {
    const checked = checkState[id][i];
    const nfQ = nfArr[i] || null;
    const naQ = naArr[i] || null;
    const ansAttr = naQ ? ` data-answer="${naQ.replace(/"/g,'&quot;')}"` : '';
    return `<div class="eh-item">
      <div class="eh-check ${checked?'checked':''}" onclick="toggleEH(${c.id},${i});event.stopPropagation()"></div>
      <div><div>${e}</div>${nfQ ? `<div class="eh-nf"${ansAttr}>↳ ${nfQ}</div>` : ''}</div>
    </div>`;
  }).join('');

  const fragenHtml = c.fragen.map(f => `<div class="frage-item">${f}</div>`).join('');

  const medsHtml = c.meds.length ? `<div class="meds-grid">${c.meds.map(m=>`
    <div class="med-card">
      <div class="med-name">${m.n}</div>
      <div class="med-dosis">${m.d}</div>
      ${m.h ? `<div class="med-hinweis">${m.h}</div>` : ''}
    </div>`).join('')}</div>` : '<em style="color:#aaa;font-size:.85rem">Keine spezifischen Medikamente</em>';

  const fallstrickeHtml = c.fallstricke.length ? `<div class="fallstricke-list">${c.fallstricke.map(f=>`<div class="fallstrick-item">${f}</div>`).join('')}</div>` : '';

  document.getElementById('detail-view').innerHTML = `
    <button class="detail-back" onclick="closeCase()">← Zurück zur Übersicht</button>
    <div class="detail-header">
      <div class="detail-header-top">
        <div>
          <div style="font-size:.75rem;color:#aaa;font-weight:500;margin-bottom:.25rem">Fall ${c.id} · AGNN: ${c.agnn}</div>
          <div class="detail-title">${c.title}</div>
          <div class="detail-badges">
            ${renderBadge('badge bg-'+c.cat, getCatLabel(c.cat))}
            ${renderBadge('diff-'+c.diff, c.diff==='basis'?'Basis':'Fortgeschritten')}
          </div>
        </div>
        <button class="detail-print-btn" onclick="window.print()">Drucken</button>
      </div>
      ${c.notruf ? `<div class="dispatch-chips"><span class="dispatch-chip korrekt">${c.notruf.korrekt}</span><span class="dispatch-chip irre">${c.notruf.irre}</span></div>` : ''}
      <div class="detail-alarm">
        <strong>Alarmierung / Fallvorstellung</strong>
        ${c.alarm}
      </div>
      <div class="vitals-grid">${vitalsHtml}</div>
      ${c.befund ? `<div class="befund-box" style="margin-top:.75rem"><strong style="font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:#888;display:block;margin-bottom:.3rem">Befund</strong>${c.befund}</div>` : ''}
    </div>

    <div class="detail-section">
      <div class="section-title" style="color:#047857">Erwartungshorizont (Muster-WBO Notfallmedizin)</div>
      <div class="eh-list" id="eh-list-${c.id}">${ehHtml}</div>
      <div style="margin-top:.6rem;font-size:.75rem;color:#aaa">Häkchen = Kandidat hat diesen Punkt korrekt benannt</div>
    </div>

    <div class="detail-section">
      <div class="section-title" style="color:#1d4ed8">Prüferfragen</div>
      <div class="fragen-list">${fragenHtml}</div>
    </div>

    <div class="detail-section">
      <div class="section-title" style="color:#b45309">AGNN-Medikamente & Dosierungen (2026)</div>
      ${medsHtml}
    </div>

    ${fallstrickeHtml ? `<div class="detail-section">
      <div class="section-title" style="color:#dc2626">Typische Fehler / Fallstricke</div>
      ${fallstrickeHtml}
    </div>` : ''}
  `;

  document.getElementById('grid-view').style.display = 'none';
  const dv = document.getElementById('detail-view');
  dv.style.display = 'block';
  dv.scrollIntoView({behavior:'smooth',block:'start'});
  window.scrollTo(0,0);
}

function closeCase(){
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('grid-view').style.display = 'grid';
}

function toggleEH(caseId, idx){
  if(!checkState[caseId]) return;
  checkState[caseId][idx] = !checkState[caseId][idx];
  const list = document.getElementById('eh-list-'+caseId);
  if(list){
    const items = list.querySelectorAll('.eh-check');
    if(items[idx]){
      items[idx].classList.toggle('checked', checkState[caseId][idx]);
    }
  }
}

// Filter buttons
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat || 'all';
  currentFilter = cat;
  renderGrid();
});

loadCandidates();
renderGrid();
</script>
